# Static checks and the test suites. Kept apart from any existing workflow so that the two cannot collide.
name: lint-and-test

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (warnings and errors)
        run: |
          shellcheck -S warning -x scripts/*.sh scripts/container/*.sh oxidized/*.sh tests/*.sh tests/fakebin/* run

  powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: parse the PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem scripts -Filter *.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { Write-Host "$($f.Name): $_" }; $failed = $true }
            else { Write-Host "$($f.Name): ok" }
          }
          if ($failed) { exit 1 }

  config-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Caddyfile is valid
        run: |
          docker run --rm -v "$PWD/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Grafana dashboards are valid JSON
        run: |
          for f in grafana/dashboards/*.json; do python3 -m json.tool "$f" > /dev/null && echo "$f: ok"; done

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: MariaDB, for the restore test of verify.sh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-server
          sudo systemctl stop mariadb || true
      - name: all test suites
        run: bash tests/all.sh
